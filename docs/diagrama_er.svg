<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="640" fill="#ffffff"/>

  <!-- ================= USUARIOS ================= -->
  <g>
    <rect x="40" y="40" width="260" height="230" fill="#eef5f5" stroke="#0d6e6e" stroke-width="1.5" rx="4"/>
    <rect x="40" y="40" width="260" height="28" fill="#0d6e6e" rx="4"/>
    <rect x="40" y="58" width="260" height="10" fill="#0d6e6e"/>
    <text x="170" y="59" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="14">USUARIOS</text>

    <text x="52" y="90"  font-size="12">id</text><text x="150" y="90" font-size="12" fill="#555">INT (PK)</text>
    <text x="52" y="110" font-size="12">nome</text><text x="150" y="110" font-size="12" fill="#555">VARCHAR(150)</text>
    <text x="52" y="130" font-size="12">email</text><text x="150" y="130" font-size="12" fill="#555">VARCHAR(150) UK</text>
    <text x="52" y="150" font-size="12">senha</text><text x="150" y="150" font-size="12" fill="#555">VARCHAR(255)</text>
    <text x="52" y="170" font-size="12">tipo</text><text x="150" y="170" font-size="12" fill="#555">ENUM</text>
    <text x="52" y="190" font-size="12">telefone</text><text x="150" y="190" font-size="12" fill="#555">VARCHAR(20)</text>
    <text x="52" y="210" font-size="12">cidade</text><text x="150" y="210" font-size="12" fill="#555">VARCHAR(100)</text>
    <text x="52" y="230" font-size="12">criado_em</text><text x="150" y="230" font-size="12" fill="#555">DATETIME</text>
    <text x="52" y="250" font-size="12">(id, PK)</text>
  </g>

  <!-- ================= DEMANDAS ================= -->
  <g>
    <rect x="500" y="40" width="280" height="290" fill="#eef5f5" stroke="#0d6e6e" stroke-width="1.5" rx="4"/>
    <rect x="500" y="40" width="280" height="28" fill="#0d6e6e" rx="4"/>
    <rect x="500" y="58" width="280" height="10" fill="#0d6e6e"/>
    <text x="640" y="59" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="14">DEMANDAS</text>

    <text x="512" y="90"  font-size="12">id</text><text x="640" y="90" font-size="12" fill="#555">INT (PK)</text>
    <text x="512" y="110" font-size="12">solicitante_id</text><text x="640" y="110" font-size="12" fill="#555">INT (FK)</text>
    <text x="512" y="130" font-size="12">voluntario_id</text><text x="640" y="130" font-size="12" fill="#555">INT (FK, opcional)</text>
    <text x="512" y="150" font-size="12">titulo</text><text x="640" y="150" font-size="12" fill="#555">VARCHAR(150)</text>
    <text x="512" y="170" font-size="12">descricao</text><text x="640" y="170" font-size="12" fill="#555">TEXT</text>
    <text x="512" y="190" font-size="12">tipo_peca</text><text x="640" y="190" font-size="12" fill="#555">VARCHAR(100)</text>
    <text x="512" y="210" font-size="12">status</text><text x="640" y="210" font-size="12" fill="#555">ENUM</text>
    <text x="512" y="230" font-size="12">ativa</text><text x="640" y="230" font-size="12" fill="#555">TINYINT(1)</text>
    <text x="512" y="250" font-size="12">criado_em</text><text x="640" y="250" font-size="12" fill="#555">DATETIME</text>
    <text x="512" y="270" font-size="12">atualizado_em</text><text x="640" y="270" font-size="12" fill="#555">DATETIME</text>
    <text x="512" y="290" font-size="12">(id, PK)</text>
    <text x="512" y="310" font-size="12">(solicitante_id, voluntario_id: FK)</text>
  </g>

  <!-- ================= HISTORICO_STATUS ================= -->
  <g>
    <rect x="270" y="410" width="300" height="210" fill="#eef5f5" stroke="#0d6e6e" stroke-width="1.5" rx="4"/>
    <rect x="270" y="410" width="300" height="28" fill="#0d6e6e" rx="4"/>
    <rect x="270" y="428" width="300" height="10" fill="#0d6e6e"/>
    <text x="420" y="429" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="14">HISTORICO_STATUS</text>

    <text x="282" y="460" font-size="12">id</text><text x="440" y="460" font-size="12" fill="#555">INT (PK)</text>
    <text x="282" y="480" font-size="12">demanda_id</text><text x="440" y="480" font-size="12" fill="#555">INT (FK)</text>
    <text x="282" y="500" font-size="12">usuario_id</text><text x="440" y="500" font-size="12" fill="#555">INT (FK)</text>
    <text x="282" y="520" font-size="12">status_anterior</text><text x="440" y="520" font-size="12" fill="#555">ENUM (opcional)</text>
    <text x="282" y="540" font-size="12">status_novo</text><text x="440" y="540" font-size="12" fill="#555">ENUM</text>
    <text x="282" y="560" font-size="12">observacao</text><text x="440" y="560" font-size="12" fill="#555">TEXT</text>
    <text x="282" y="580" font-size="12">data_alteracao</text><text x="440" y="580" font-size="12" fill="#555">DATETIME</text>
    <text x="282" y="600" font-size="12">(id, PK) · (demanda_id, usuario_id: FK)</text>
  </g>

  <!-- ================= LINHAS DE RELACIONAMENTO ================= -->
  <!-- usuarios -> demandas (solicitante) -->
  <line x1="300" y1="120" x2="500" y2="110" stroke="#333" stroke-width="1.3"/>
  <text x="330" y="105" font-size="11" fill="#333">1 solicita N (solicitante_id)</text>

  <!-- usuarios -> demandas (voluntario) -->
  <line x1="300" y1="160" x2="500" y2="140" stroke="#333" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="330" y="185" font-size="11" fill="#333">0..1 atende N (voluntario_id)</text>

  <!-- demandas -> historico -->
  <line x1="600" y1="330" x2="470" y2="420" stroke="#333" stroke-width="1.3"/>
  <text x="510" y="375" font-size="11" fill="#333">1 gera N</text>

  <!-- usuarios -> historico (usuario_id, quem alterou) -->
  <line x1="170" y1="270" x2="330" y2="410" stroke="#333" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="185" y="345" font-size="11" fill="#333">1 registra N (usuario_id)</text>

  <text x="450" y="630" text-anchor="middle" font-size="11" fill="#888">Figura — Diagrama entidade-relacionamento do banco Conecta3D</text>
</svg>
